var clamp = function (v, a, b) { if (a === undefined) a = 0; if (b === undefined) b = 1; return Math.max(a, Math.min(b, v)); };
var lerp = function (a, b, k) { return a + (b - a) * k; };

function hashInt(n) {
  n = Math.imul(n ^ (n >>> 16), 2246822507);
  n = Math.imul(n ^ (n >>> 13), 3266489909);

}

var BOILN = 0;

    if (t < keys[i][0]) {

/* ---------------------------------------------------------------- geometry */
function rrectPts(cx, cy, w, h, r, seed, amp) {
  amp = amp === undefined ? 1.2 : amp;
  var random = mulberry32(seed >>> 0);

  if (r > hw) r = hw;
  if (r > hh) r = hh;

}
function ellipsePts(cx, cy, rx, ry, seed, amp, n) {
  amp = amp === undefined ? 1.2 : amp;
  n = n || 56;
  var random = mulberry32(seed >>> 0), p = [];
  for (var i = 0; i < n; i++) {

function arcPts(cx, cy, r, a0, a1, n, seed, amp) {
  amp = amp === undefined ? 1.3 : amp;
  var random = mulberry32(seed >>> 0), p = [];
  for (var i = 0; i <= n; i++) {

}
function catmullSample(pts, closed, per) {

  if (n < 2) return pts.slice();
  var get = function (i) {
    if (closed) return pts[(i % n + n) % n];
    return pts[Math.max(0, Math.min(n - 1, i))];
  };
  var out = [], lim = closed ? n : n - 1;
  for (var i = 0; i < lim; i++) {
    var p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    for (var k = 0; k < per; k++) {

}
function inkStroke(g, pts, width, color) {

  g.save();
  g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(f[0][0], f[0][1]);

  g.stroke(); g.restore();
}
function inkRing(g, pts, width, color) {
  if (!pts || pts.length < 3) return;

  tracePts(g, pts, true, 5); g.stroke(); g.restore();

function brushStroke(g, pts, w0, w1, color, opts) {
  opts = opts || {};

  for (i = 0; i < n; i++) {
    var a = f[Math.max(0, i - 1)], b = f[Math.min(n - 1, i + 1)];
    var dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;

  var s = size / 2;

/* ---------------------------------------------------------------- text */
var SANS = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Micro Hei",sans-serif';

function makePaper() {
  var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var g = cv.getContext('2d');
  g.fillStyle = COL.paper; g.fillRect(0, 0, W, H);
  var lg = g.createLinearGradient(0, 0, W, H);
  lg.addColorStop(0, 'rgba(255,250,236,0.62)');
  lg.addColorStop(0.5, 'rgba(244,234,216,0)');
  lg.addColorStop(1, 'rgba(202,176,140,0.30)');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  var rnd = mulberry32(1337);
  for (var i = 0; i < 92; i++) {
    var x = rnd() * W, y = rnd() * H, r = 100 + rnd() * 440;
    var gr = g.createRadialGradient(x, y, 0, x, y, r);
    var a = 0.025 + rnd() * 0.055;
    gr.addColorStop(0, 'rgba(' + (146 + (rnd() * 36 | 0)) + ',' + (110 + (rnd() * 28 | 0)) + ',' + (72 + (rnd() * 26 | 0)) + ',' + a + ')');
    gr.addColorStop(1, 'rgba(150,115,75,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  for (var j = 0; j < 1700; j++) {
    var fx = rnd() * W, fy = rnd() * H, l = 5 + rnd() * 24, ang = rnd() * TAU;
    g.strokeStyle = 'rgba(102,80,56,' + (0.035 + rnd() * 0.065) + ')';

      fx + Math.cos(ang) * l, fy + Math.sin(ang) * l);
    g.stroke();
  }
  var rg = g.createRadialGradient(W * 0.47, H * 0.42, H * 0.18, W * 0.5, H * 0.5, H * 0.86);
  rg.addColorStop(0, 'rgba(255,248,232,0.18)');
  rg.addColorStop(1, 'rgba(158,126,90,0.20)');

function makeGrain() {
  var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  var g = cv.getContext('2d');

function makeCardSprite(kind, variant) {

  var seed = spec.seed + variant * 977;
  var silhouette = rrectPts(0, 0, w, h, spec.r, seed, 1.15);

  g.save();
  tracePts(g, rrectPts(0, 0, w + 8, h + 8, spec.r, seed + 5, 2.3), true, 4);
  g.filter = 'blur(15px)';
  g.fillStyle = rgba(spec.color, 0.24);

  g.restore();
  g.filter = 'none';

  g.save();
  tracePts(g, silhouette, true, 4); g.clip();
  if (kind === 'A') baseA(g, w, h, seed);
  else if (kind === 'B') baseB(g, w, h, seed);
  else baseC(g, w, h, seed);
  g.restore();

  g.save();
  tracePts(g, silhouette, true, 4); g.clip();
  if (kind === 'A') contentA(g, w, h, seed);
  else if (kind === 'B') contentB(g, w, h, seed);
  else contentC(g, w, h, seed);
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = 0.42;

  g.strokeStyle = rgba(mixHex(spec.color, COL.ink, 0.4), 0.28);

  inkRing(g, rrectPts(0, 0, w, h, spec.r, seed + 41 + variant * 37, 0.95), 4.6, rgba(COL.ink, 0.86));

/* ---------------------------------------------------------------- camera */
function camAt(t) {

  return {
    x: lerp(905, 960, k),
    y: lerp(500, 540, k),
    z: lerp(1.055, 1.0, k)
  };

/* ---------------------------------------------------------------- streams */
function bez(p0, p1, p2, p3, u) {
  var iu = 1 - u;
  return [
    iu * iu * iu * p0[0] + 3 * iu * iu * u * p1[0] + 3 * iu * u * u * p2[0] + u * u * u * p3[0],
    iu * iu * iu * p0[1] + 3 * iu * iu * u * p1[1] + 3 * iu * u * u * p2[1] + u * u * u * p3[1]
  ];
}
function bezTan(p0, p1, p2, p3, u) {
  var iu = 1 - u;
  return [
    3 * iu * iu * (p1[0] - p0[0]) + 6 * iu * u * (p2[0] - p1[0]) + 3 * u * u * (p3[0] - p2[0]),
    3 * iu * iu * (p1[1] - p0[1]) + 6 * iu * u * (p2[1] - p1[1]) + 3 * u * u * (p3[1] - p2[1])
  ];
}

function drawStream(g, S, t) {
  var lead = 1 - Math.pow(1 - seg(t, S.start, S.arrive), 1.55);
  if (lead <= 0.001) return;
  var fade = 1 - 0.28 * ease(seg(t, 5.0, 5.9));
  var n = 76;
  var pts = [], widths = [];
  for (var i = 0; i <= n; i++) {
    var u = lead * i / n;
    var p = bez(S.p0, S.c1, S.c2, S.p3, u);
    var tan = bezTan(S.p0, S.c1, S.c2, S.p3, u);
    var len = Math.hypot(tan[0], tan[1]) || 1;
    var nx = -tan[1] / len, ny = tan[0] / len;
    var emerge = 0.18 + 0.82 * Math.pow(clamp(u / 0.17), 0.65);
    var tipK = lead < 0.995 ? clamp((lead - u) / 0.055, 0.30, 1) : 1;
    var endK = 1 - 0.18 * clamp((u - 0.82) / 0.18);
    var pulse = 0.90 + 0.14 * Math.sin(u * 13.5 - t * 4.2 + S.phase);
    var w = S.base * emerge * tipK * endK * pulse;
    pts.push([p[0], p[1], nx, ny]);
    widths.push(w);
  }
  var tipP = pts[pts.length - 1];
  var grad = g.createLinearGradient(S.p0[0], S.p0[1], tipP[0], tipP[1]);
  grad.addColorStop(0, rgba(S.color, 0.95));
  grad.addColorStop(0.45, rgba(S.color, 0.88));
  grad.addColorStop(1, rgba(mixHex(S.color, S.light, 0.52), 0.86));
  g.save();
  g.globalAlpha = fade;
  g.beginPath();
  for (var a = 0; a < pts.length; a++) {
    var P = pts[a], ww = widths[a] / 2;
    var x = P[0] + P[2] * ww, y = P[1] + P[3] * ww;
    if (a === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  for (var b = pts.length - 1; b >= 0; b--) {
    var Q = pts[b], w2 = widths[b] / 2;
    g.lineTo(Q[0] - Q[2] * w2, Q[1] - Q[3] * w2);
  }
  g.closePath();
  g.fillStyle = grad; g.fill();
  g.beginPath();
  for (var c = 0; c < pts.length; c++) {
    var R = pts[c], w3 = widths[c] * 0.20;
    var xx = R[0] + R[2] * w3, yy = R[1] - R[3] * w3;
    if (c === 0) g.moveTo(xx, yy); else g.lineTo(xx, yy);
  }
  g.strokeStyle = rgba(COL.cream, 0.30);
  g.lineWidth = Math.max(1.1, S.base * 0.15 * (lead < 1 ? 0.6 : 1));
  g.lineCap = 'round'; g.stroke();
  g.restore();

  g.save();
  g.globalAlpha = fade * 0.48;
  g.strokeStyle = rgba(S.dark, 0.78);
  g.lineWidth = 1.7 + S.base * 0.035;
  g.beginPath();
  for (var e = 0; e < pts.length; e++) {
    var E = pts[e], ww2 = widths[e] / 2;
    var ex = E[0] - E[2] * ww2, ey = E[1] - E[3] * ww2;
    if (e === 0) g.moveTo(ex, ey); else g.lineTo(ex, ey);
  }
  g.stroke();
  g.restore();

  var tipW = widths[widths.length - 1];
  g.save();
  g.globalAlpha = fade * (lead < 0.995 ? 0.95 : 0.0);
  g.fillStyle = rgba(S.light, 0.95);
  g.beginPath(); g.arc(tipP[0], tipP[1], Math.max(4, tipW * 0.68), 0, TAU); g.fill();
  g.fillStyle = rgba(S.color, 0.9);
  g.beginPath(); g.arc(tipP[0] + 2, tipP[1] + 2, Math.max(2.5, tipW * 0.42), 0, TAU); g.fill();
  g.restore();

  if (lead > 0.28) {
    for (var k = 0; k < 3; k++) {
      var uu = (frac(t * 0.34 + k / 3 + S.phase * 0.07) * 0.78 + 0.14) * lead;
      var pp = bez(S.p0, S.c1, S.c2, S.p3, uu);
      var rr = 2.4 + (k === 0 ? 1.6 : 0) + (S.base * 0.05);
      g.save(); g.globalAlpha = fade * 0.55;
      g.fillStyle = rgba(S.light, 0.9);
      g.beginPath(); g.arc(pp[0], pp[1], rr, 0, TAU); g.fill();
      g.restore();
    }
  }
}

/* ---------------------------------------------------------------- bowl */
function liquidPath(g, topY, t, level) {
  g.beginPath();
  var x0 = -200, x1 = 200;
  for (var x = x0; x <= x1; x += 10) {
    var yy = topY + Math.sin(x * 0.031 + t * 1.5) * 5.5 * Math.sin(Math.PI * clamp(level * 1.1)) +
             Math.sin(x * 0.071 - t * 0.9) * 2.0;
    if (x === x0) g.moveTo(x, yy); else g.lineTo(x, yy);
  }
  g.lineTo(x1, 210); g.lineTo(x0, 210); g.closePath();
}

function drawBowl(g, t) {

  rimGrad.addColorStop(0, '#E8C79B'); rimGrad.addColorStop(0.45, '#D5A97A'); rimGrad.addColorStop(1, '#B98658');
  g.fillStyle = rimGrad; tracePts(g, outerPts, true, 4); g.fill();

/* ---------------------------------------------------------------- character */
function elbowOf(sh, hand) {
  var mx = (sh[0] + hand[0]) / 2, my = (sh[1] + hand[1]) / 2;
  var dx = hand[0] - sh[0], dy = hand[1] - sh[1], d = Math.hypot(dx, dy) || 1;
  var nx = -dy / d, ny = dx / d;
  if (ny < 0) { nx = -nx; ny = -ny; }
  var bend = Math.min(46, d * 0.18);
  return [mx + nx * bend, my + ny * bend];
}
function drawArm(g, sh, hand) {

  g.strokeStyle = COL.clay; g.lineWidth = 16;

function drawFace(g, t, mood) {

      g.rotate(wob * 0.045);
      g.globalAlpha = ap;
      var sc = 0.94 + 0.06 * backOut(ap);
      g.scale(sc, sc);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '600 ' + size + 'px ' + SERIF;
      g.fillStyle = 'rgba(168,77,51,0.18)';
      g.fillText(ch, 2.2, 3.0);
      g.fillStyle = rgba(COL.ink, 0.95);
      g.fillText(ch, 0, 0);
      g.restore();
    }
    x += cw + size * 0.06;
  }
  var titleEnd = 110 + total;

  var sa = ease(seg(t, 0.55, 0.85));
  if (sa > 0.01) {
    g.save();
    g.translate(titleEnd + 34, 148);
    g.rotate(-0.05);
    var ssc = 0.8 + 0.2 * backOut(sa);
    g.scale(ssc, ssc);
    g.globalAlpha = sa;
    /* stable vermilion stamp so it never flickers between boil drawings */
    roundSquarePath(g, 46, 7);
    g.fillStyle = 'rgba(181,72,52,0.92)';
    g.fill();
    g.strokeStyle = 'rgba(255,247,230,0.88)'; g.lineWidth = 2.2;
    g.beginPath(); g.arc(0, 0, 11, 0, TAU); g.stroke();
    g.fillStyle = 'rgba(255,247,230,0.92)';
    g.beginPath(); g.arc(0, 0, 4.2, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,247,230,0.55)'; g.lineWidth = 1.5;
    g.strokeRect(-17, -17, 34, 34);
    g.restore();
  }

  var uk = ease(seg(t, 0.22, 0.95));
  if (uk > 0.01) {
    var line = catmullSample([[112, 193], [246, 187], [388, 191], [titleEnd + 6, 185]], false, 9);
    var n = Math.max(2, Math.floor(line.length * uk));
    brushStroke(g, line.slice(0, n), 8, 1.4, rgba(COL.clayDk, 0.84), { seed: 12 });
  }

  var subA = ease(seg(t, 0.34, 0.72));
  if (subA > 0.01) {
    drawText(g, '按相关程度分配权重，再汇总', 112, 224, 27, rgba(COL.inkSoft, 0.90), { weight: '400', alpha: subA });
  }

  var fA = ease(seg(t, 0.9, 1.5));
  if (fA > 0.01) {
    drawText(g, '权重数字为教学示意', 1806, 84, 21, rgba(COL.inkSoft, 0.62), { align: 'right', weight: '400', alpha: fA });
  }
}

/* ---------------------------------------------------------------- frame */
function drawFrame(t) {
  t = clamp(t, 0, DUR);
  BOILN = Math.floor(t * 12);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(paperC, 0, 0);

  var cam = camAt(t);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  ctx.drawImage(worldWashC, 0, 0);

  for (var i = 0; i < STREAMS.length; i++) drawStream(ctx, STREAMS[i], t);

  drawCards(ctx, t);
  for (var k = 0; k < TOKENS.length; k++) drawToken(ctx, TOKENS[k], t);

  drawBowl(ctx, t);
  drawImpacts(ctx, t);
  drawCharacter(ctx, t);
  drawAnnotations(ctx, t);

  ctx.restore();

  drawTitles(ctx, t);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(grainC, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function frame(t) {
  var tt = Number(t);
  if (!isFinite(tt)) tt = 0;
  drawFrame(clamp(tt, 0, DUR));
}

initAssets();
window.film = { frame: frame, duration: DUR, caption: CAPTION };
window.renderAt = function (t) { frame(t); return canvas.toDataURL('image/png'); };
window.ready = true;
frame(0.03);
})();
</script>
